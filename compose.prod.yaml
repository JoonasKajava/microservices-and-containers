services:
  pocket-id:
    image: pocketid/pocket-id:v2
    restart: unless-stopped
    networks:
      - internal
    env_file: .env
    ports:
      - 1411:1411
    volumes:
      - "./pocket-id:/app/data"
  caddy:
    image: caddy
    restart: unless-stopped
    networks:
      - public
      - internal
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - $PWD/conf:/etc/caddy
      - $PWD/site:/srv
      - caddy_data:/data
      - caddy_config:/config
  ui:
    networks:
      - internal
    build:
      context: ./equipment-reservation-ui
      dockerfile: Dockerfile
networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
volumes:
  caddy_data:
  caddy_config:
