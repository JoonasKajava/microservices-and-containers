services:
  inventory:
    build:
      context: ./inventory/
      dockerfile: ./Dockerfile
    image: inventory
    networks:
      - equipment-reservation-net
  reservation:
    environment:
      INVENTORY_ENDPOINT: "http://inventory:3000"
    build:
      context: ./reservation/
      dockerfile: ./Dockerfile
    image: reservation
    networks:
      - equipment-reservation-net
networks:
  equipment-reservation-net:
    driver: bridge
